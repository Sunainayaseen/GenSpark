{% extends "vendor/base_vendor.html" %}
{% block page_title %}Add Shipment - Order #{{ order.id }}{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="{{ url_for('vendor.shipment_list') }}">Shipment</a></li><li class="breadcrumb-item active">Add</li>{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Courier Name</label>
        <input type="text" name="courier_name" class="form-control" placeholder="e.g. BlueDart, Delhivery">
      </div>
      <div class="form-group">
        <label>Tracking Number</label>
        <input type="text" name="tracking_number" class="form-control" placeholder="Tracking ID">
      </div>
      <button type="submit" class="btn btn-primary">Record Shipment</button>
      <a href="{{ url_for('vendor.shipment_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
