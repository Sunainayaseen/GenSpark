<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenSpark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --muted: #64748b;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .hero {
      text-align: center;
      max-width: 640px;
    }
    .brand {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(90deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 1rem;
      font-weight: 400;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0 0 2.5rem 0;
    }
    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: 0 1px 3px rgba(59, 130, 246, 0.4);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .btn-outline {
      background: transparent;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1 class="brand">GenSpark</h1>
    <p class="tagline">Business Platform</p>
    <div class="actions">
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
        <i class="fas fa-sign-in-alt"></i> Sign in
      </a>
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline">
        <i class="fas fa-cog"></i> Admin
      </a>
      <a href="{{ url_for('vendor.dashboard') }}" class="btn btn-outline">
        <i class="fas fa-store"></i> Vendor
      </a>
    </div>
  </div>
</body>
</html>
