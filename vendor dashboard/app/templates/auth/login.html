<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – GenSpark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f0fdfa 0%, #f1f5f9 45%, #e2e8f0 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-page {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }
    .login-card {
      background: #fff;
      border-radius: 0 !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.04);
      overflow: hidden;
    }
    .login-header {
      padding: 2.25rem 2rem 1rem;
      text-align: center;
    }
    .login-logo {
      font-size: 1.625rem;
      font-weight: 700;
      color: #22A39F;
      letter-spacing: -0.03em;
      text-decoration: none;
      display: inline-block;
      transition: color .2s;
    }
    .login-logo:hover { color: #1a8582; }
    .login-logo:focus-visible { outline: 2px solid #22A39F; outline-offset: 4px; }
    .login-title {
      margin: 0.375rem 0 0;
      font-size: 0.9375rem;
      font-weight: 500;
      color: #64748b;
    }
    .login-body {
      padding: 0 2rem 2.25rem;
    }
    .login-form .form-group {
      margin-bottom: 1.375rem;
    }
    .login-form label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }
    .login-form .input-wrap {
      position: relative;
    }
    .login-form .input-wrap .fa {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.9rem;
      pointer-events: none;
      transition: color .2s;
    }
    .login-form .input-wrap:focus-within .fa { color: #22A39F; }
    .login-form .form-control {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-size: 0.9375rem;
      border-radius: 0 !important;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #1a1a1a;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-form .form-control::placeholder { color: #94a3b8; }
    .login-form .form-control:hover { border-color: #cbd5e1; }
    .login-form .form-control:focus {
      border-color: #22A39F;
      box-shadow: 0 0 0 2px rgba(34, 163, 159, 0.2);
      outline: none;
    }
    .login-form .form-control:focus-visible { outline: none; }
    .btn-signin {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: 0 !important;
      border: none;
      background: linear-gradient(135deg, #22A39F 0%, #1a8582 100%);
      color: #fff;
      cursor: pointer;
      transition: background .2s, transform .2s, box-shadow .2s;
      box-shadow: 0 2px 8px rgba(34, 163, 159, 0.25);
    }
    .btn-signin:hover {
      background: linear-gradient(135deg, #1a8582 0%, #145c5a 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(34, 163, 159, 0.35);
    }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin:focus-visible { outline: 2px solid #22A39F; outline-offset: 2px; }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
    }
    .login-footer-inner {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 400;
    }
    .login-footer a {
      font-weight: 600;
      color: #22A39F;
      text-decoration: none;
    }
    .login-footer a:hover { color: #1a8582; text-decoration: underline; }
    .login-footer a:focus-visible { outline: 2px solid #22A39F; outline-offset: 2px; }
    .login-alert {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0 !important;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .login-alert.alert-success { background: #ecfdf5; color: #065f46; }
    .login-alert.alert-danger { background: #fef2f2; color: #b91c1c; }
    .login-alert.alert-warning { background: #fffbeb; color: #92400e; }
    .login-alert.alert-info { background: #eff6ff; color: #1e40af; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <a href="{{ url_for('auth.login') }}" class="login-logo">GenSpark</a>
      <p class="login-title">Sign in to your account</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="login-alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form class="login-form" action="{{ url_for('auth.login') }}" method="post" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="fas fa-envelope"></span>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email" value="{{ request.form.email if request.form else '' }}">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="fas fa-lock"></span>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn-signin">Sign in</button>
      </form>
      <div class="login-footer">
        <p class="login-footer-inner">Don't have an account? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
