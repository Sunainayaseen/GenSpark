{% extends "admin/base_admin.html" %}
{% block page_title %}{{ 'Edit' if brand else 'Add' }} Brand{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item active">Brand</li>{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post" action="{{ url_for('admin.brand_add') if not brand else url_for('admin.brand_edit', brand_id=brand.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" class="form-control" value="{{ brand.name if brand else '' }}" required>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('admin.brands_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
