{% extends "vendor/base_vendor.html" %}
{% block page_title %}Add to Inventory{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="{{ url_for('vendor.inventory') }}">Inventory</a></li><li class="breadcrumb-item active">Add</li>{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="get" action="{{ url_for('vendor.inventory_add') }}" class="form-inline mb-3">
      <label class="mr-2">Filter by brand:</label>
      <select name="brand_id" class="form-control form-control-sm mr-2" onchange="this.form.submit()">
        <option value="">All brands</option>
        {% for b in brands %}
        <option value="{{ b.id }}" {{ 'selected' if selected_brand_id == b.id else '' }}>{{ b.name }}</option>
        {% endfor %}
      </select>
    </form>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Component</label>
        <select name="component_id" class="form-control" required>
          <option value="">-- Select --</option>
          {% for c in components %}
          <option value="{{ c.id }}">{{ c.name }}{% if c.brand %} ({{ c.brand.name }}){% endif %} – {{ c.category.name if c.category else '-' }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row">
        <div class="col-md-6 form-group">
          <label>Quantity</label>
          <input type="number" name="quantity" class="form-control" value="{{ item.quantity if item else 0 }}" min="0">
        </div>
        <div class="col-md-6 form-group">
          <label>Price (Rs.)</label>
          <input type="number" step="0.01" name="price" class="form-control" value="{{ item.price if item else '' }}">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{{ url_for('vendor.inventory') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
