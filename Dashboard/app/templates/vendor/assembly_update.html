{% extends "vendor/base_vendor.html" %}
{% block page_title %}Update Assembly - Order #{{ order.id }}{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="{{ url_for('vendor.assembly_list') }}">Assembly</a></li><li class="breadcrumb-item active">Update</li>{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Stage</label>
        <select name="stage" class="form-control">
          <option value="in_assembly" {{ 'selected' if tracking and tracking.stage == 'in_assembly' else '' }}>In Assembly</option>
          <option value="testing" {{ 'selected' if tracking and tracking.stage == 'testing' else '' }}>Testing</option>
          <option value="completed" {{ 'selected' if tracking and tracking.stage == 'completed' else '' }}>Completed (Send to QA)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Progress Notes</label>
        <textarea name="progress_notes" class="form-control" rows="3">{{ tracking.progress_notes if tracking else '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="{{ url_for('vendor.assembly_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
