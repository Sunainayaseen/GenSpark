<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Header - Logo Left, Nav Center, Buttons Right</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 200vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ================= HEADER ================= */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 18px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            
            /* Transparent Glass Effect */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .header.scrolled {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* ================= LOGO (LEFT SIDE) ================= */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-weight: bold;
        }

        /* ================= NAVIGATION (CENTER) ================= */
        .nav {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
            flex: 1;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .nav a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            background: #00eaff;
            left: 0;
            bottom: -6px;
            transition: width 0.3s ease;
        }

        .nav a:hover::after,
        .nav a.active::after {
            width: 100%;
        }

        .nav a:hover {
            color: #00eaff;
        }

        /* ================= BUTTONS (RIGHT SIDE) ================= */
        .header-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 25px;
            border: 1px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn.primary {
            background: #00eaff;
            border: none;
            color: black;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: #00d4e6;
        }

        /* ================= HERO SECTION ================= */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            text-align: center;
            color: white;
            padding-top: 80px;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .nav {
                display: none;
            }

            .header-buttons {
                gap: 10px;
            }

            .btn {
                padding: 6px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<header class="header" id="header">
    <!-- LEFT: LOGO + TEXT -->
    <a href="/" class="logo">
        <img src="https://via.placeholder.com/40" alt="Logo">
        <span class="logo-text">GenSpark Builds</span>
    </a>

    <!-- CENTER: NAVIGATION LINKS -->
    <nav class="nav">
        <a href="#" class="active">Home</a>
        <a href="#">Builds</a>
        <a href="#">Blogs</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- RIGHT: BUTTONS -->
    <div class="header-buttons">
        <button class="btn">Login</button>
        <button class="btn primary">Sign Up</button>
    </div>
</header>

<div class="hero">
    Transparent Header<br>
    Logo Left | Nav Center | Buttons Right
</div>

<script>
    const header = document.getElementById("header");

    window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
            header.classList.add("scrolled");
        } else {
            header.classList.remove("scrolled");
        }
    });
</script>

</body>
</html>
