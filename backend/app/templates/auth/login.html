<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – GenSpark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #02457A;
      --primary-dark: #001B48;
      --primary-rgb: 2, 69, 122;
      --bg-primary: #fafaf8;
      --bg-secondary: #f3f2ee;
      --bg-tertiary: #e9e6e0;
      --text-primary: #3e4444;
      --text-secondary: rgba(62, 68, 68, 0.82);
      --text-tertiary: rgba(62, 68, 68, 0.68);
      --border: rgba(64, 93, 39, 0.08);
      --success: #065f46;
      --error: #b91c1c;
      --warning: #92400e;
      --info: #1e40af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--bg-primary) 0%, var(--bg-secondary) 45%, var(--bg-tertiary) 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login-page {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }
    .login-card {
      background: #fff;
      border-radius: 0 !important;
      box-shadow: 0 8px 32px rgba(0,0,0,.06), 0 0 0 1px var(--border);
      overflow: hidden;
    }
    .login-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
    }
    .login-header {
      padding: 2rem 2rem 1.1rem;
      text-align: center;
    }
    /* Square 481x481 PNG: fix width + height and crop (object-fit) so the
       horizontal lockup shows at a readable size — width:auto would render a tiny 1:1 square. */
    .login-logo-img {
      display: block;
      width: 250px;
      max-width: 100%;
      height: 54px;
      object-fit: cover;
      object-position: center center;
      margin: 0 auto;
    }
    .login-logo {
      font-size: 1.625rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.03em;
      text-decoration: none;
      display: inline-block;
      transition: color .2s;
    }
    .login-logo:hover { color: var(--primary-dark); }
    .login-logo:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
    .login-title {
      margin: 0.625rem auto 0;
      font-size: 0.8125rem;
      font-weight: 500;
      text-align: center;
      letter-spacing: 0.01em;
      color: var(--text-secondary);
    }
    .login-body {
      padding: 0 2rem 2.25rem;
    }
    .login-form .form-group {
      margin-bottom: 1.375rem;
    }
    .login-form label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .login-form .input-wrap {
      position: relative;
    }
    .login-form .input-wrap .fas {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 0.9rem;
      pointer-events: none;
      transition: color .2s;
    }
    .login-form .input-wrap:focus-within .fas { color: var(--primary); }
    .login-form .form-control {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-size: 0.9375rem;
      border-radius: 0 !important;
      border: 1px solid var(--border);
      background: #fff;
      color: #1a1a1a;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-form .form-control::placeholder { color: var(--text-tertiary); }
    .login-form .form-control:hover { border-color: rgba(var(--primary-rgb), 0.12); }
    .login-form .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(var(--primary-rgb), 0.18);
      outline: none;
    }
    .login-form .form-control:focus-visible { outline: none; }
    /* Show / hide password toggle */
    .login-form #password { padding-right: 2.85rem; }
    .pw-toggle {
      position: absolute;
      right: 0.4rem;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.15rem;
      height: 2.15rem;
      padding: 0;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: color .2s;
    }
    .pw-toggle:hover { color: var(--primary); }
    .pw-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* Neutralise the inherited left-icon positioning for the icon inside the button. */
    .pw-toggle .fas {
      position: static;
      left: auto;
      top: auto;
      transform: none;
      font-size: inherit;
      color: inherit;
      pointer-events: none;
    }
    .btn-signin {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: 0 !important;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      cursor: pointer;
      transition: background .2s, transform .2s, box-shadow .2s;
      box-shadow: 0 2px 8px rgba(var(--primary-rgb), 0.25);
    }
    .btn-signin:hover {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35);
    }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--bg-tertiary);
    }
    .login-footer-inner {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 400;
    }
    .login-footer a {
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
    }
    .login-footer a:hover { color: var(--primary-dark); text-decoration: underline; }
    .login-footer a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .login-alert {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0 !important;
      border: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .login-alert.alert-success { background: #ecfdf5; color: #065f46; }
    .login-alert.alert-danger { background: #fef2f2; color: #b91c1c; }
    .login-alert.alert-warning { background: #fffbeb; color: #92400e; }
    .login-alert.alert-info { background: #eff6ff; color: #1e40af; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-accent" aria-hidden="true"></div>
    <div class="login-header">
      <a href="{{ url_for('auth.login') }}" class="login-logo" aria-label="GenSpark Builds home">
        <img src="{{ url_for('static', filename='img/genspark-builds-logo.png') }}" alt="GenSpark Builds" class="login-logo-img">
      </a>
      <p class="login-title">Sign in to your account</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="login-alert alert-{{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form class="login-form" action="{{ url_for('auth.login') }}" method="post" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <span class="fas fa-envelope"></span>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email" value="{{ request.form.email if request.form else '' }}">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="fas fa-lock"></span>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-signin">Sign in</button>
      </form>
      <div class="login-footer">
        <p class="login-footer-inner">Don't have an account? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var input = document.getElementById('password');
    var btn = document.getElementById('pwToggle');
    if (!input || !btn) return;
    var icon = btn.querySelector('i');
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      if (icon) {
        icon.classList.toggle('fa-eye', !show);
        icon.classList.toggle('fa-eye-slash', show);
      }
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      input.focus();
    });
  })();
</script>
</body>
</html>
